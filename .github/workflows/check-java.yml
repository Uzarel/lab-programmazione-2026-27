# Compila tutti gli esercizi Java. Gira su OGNI pull request e su ogni push su main,
# anche quando non tocca file .java: un check richiesto dalla protezione del branch
# deve sempre riportare un esito, altrimenti la PR resta bloccata in attesa.
#
# Ogni cartella che contiene file .java è compilata per conto suo, a qualunque
# profondità sotto lezioni/LNN/esercizi/: così due cartelle (es. esempi/counter_v1/
# e esempi/counter_v2/) possono avere classi con lo stesso nome. Se un file dichiara
# un package, la sua cartella "radice" è quella che contiene il package: tutti i file
# con la stessa radice sono compilati insieme, quindi i package funzionano.
name: Compila esercizi Java
on:
  pull_request:
  push:
    branches: [main]
jobs:
  javac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: javac su ogni cartella di esercizi
        run: |
          set -e
          # una riga "radice<TAB>file" per ogni sorgente
          index=$(mktemp)
          find lezioni/*/esercizi -name '*.java' 2>/dev/null | sort | while IFS= read -r f; do
            dir=$(dirname "$f")
            pkg=$(sed -n 's/^[[:space:]]*package[[:space:]]\{1,\}\([A-Za-z0-9_.]\{1,\}\)[[:space:]]*;.*/\1/p' "$f" | head -n 1)
            root="$dir"
            if [ -n "$pkg" ]; then
              suffix="/$(echo "$pkg" | tr . /)"
              case "$dir" in *"$suffix") root="${dir%"$suffix"}" ;; esac
            fi
            printf '%s\t%s\n' "$root" "$f"
          done > "$index"
          if [ ! -s "$index" ]; then
            echo "Nessun file .java trovato: niente da compilare."
            exit 0
          fi
          # ogni radice è un progetto a sé. this-escape è escluso: segnala i costruttori
          # che chiamano metodi sovrascrivibili (es. versa(primo) in ContoBancario), un
          # problema solo in presenza di sottoclassi, che il corso introduce più avanti
          cut -f1 "$index" | sort -u | while IFS= read -r root; do
            echo "== $root"
            files=$(awk -F'\t' -v r="$root" '$1 == r { print $2 }' "$index")
            javac -Xlint:all,-this-escape -Werror -d "$(mktemp -d)" $files
          done