# Compila tutti gli esercizi Java. Gira su OGNI pull request e su ogni push su main,
# anche quando non tocca file .java: un check richiesto dalla protezione del branch
# deve sempre riportare un esito, altrimenti la PR resta bloccata in attesa.
name: Compila esercizi Java
on:
  pull_request:
  push:
    branches: [main]
jobs:
  javac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: javac su ogni cartella esercizi
        run: |
          set -e
          found=0
          for d in lezioni/*/esercizi; do
            files=$(find "$d" -name '*.java' 2>/dev/null)
            [ -z "$files" ] && continue
            found=1
            echo "== $d"
            out=$(mktemp -d)
            javac -Xlint:all -Werror -d "$out" $files
          done
          [ "$found" = 1 ] || echo "Nessun file .java trovato: niente da compilare."